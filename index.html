<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern architectural studio and residential home design.">
    <title>Architecture-landing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__inner container-large">
            <nav class="header__menu">
                <ul class="header__menu-list">
                    <li class="header__menu-item ">
                        <a class="header__menu-link is-active" href="/">home</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">pages</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">portfolio</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">shop</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">blog</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="/">landing</a>
                    </li>
                </ul>
            </nav>
            <a href="/" class="header__logo">
                <img class="header__logo-img" src="assets/icons/ogo-white.png.png" alt="Hiroshi Architects" width="213" height="20">
            </a>
            <button class="header__burger-btn button"
            type="button"
            title="open menu"
            aria-label="open menu">
            </button>
        </div>
    </header>
<main class="content">
    <section class="hero">
        <h1 class="visually-hidden">Hiroshi Architects — Architecture & Heritage Studio</h1>
        <div class="hero__inner">
            <div class="hero__info">
                <h2 class="hero__info-title">Willie house in Bergen</h2>
                <div class="hero__info-list">
                    <a class="hero__info-link" href="/">Architecture</a>
                    <a class="hero__info-link" href="/">Heritage</a>
                </div>
            </div>
             <div class="hero__pagination "> 
                <button class="hero__pagination-btn short"
                type='button'
                aria-label="Slide 1"></button>
                <button class="hero__pagination-btn is-active"
                type="button"
                aria-label="Slide 2"></button>
                <button class="hero__pagination-btn short"
                type="button"
                aria-label="Slide 3"></button>
            </div>
        </div>
        </div>
    </section>
</main>
</body>
</html>
